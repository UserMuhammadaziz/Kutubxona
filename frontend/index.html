<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kutubxona</title>

    <!-- PWA: ilova sifatida ochilganda qurilma kengligini qayta-qayta tasdiqlaymiz.
         Android ba'zan eski kesh yoki "kompyuter ko'rinishi" tufayli sahifani
         980px kenglikda chizib, butun interfeysni kichraytirib qo'yadi. -->
    <script>
      (function () {
        var root = document.documentElement
        var meta = document.querySelector('meta[name="viewport"]')
        var viewport = 'width=device-width, initial-scale=1.0, viewport-fit=cover'
        if (meta) meta.setAttribute('content', viewport)

        function tekshir() {
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          root.classList.toggle('pwa', standalone)
        }

        tekshir()
        window.addEventListener('resize', tekshir)
        window.addEventListener('orientationchange', tekshir)
        window.addEventListener('pageshow', tekshir)
      })()
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1A41B4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kutubxona" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
  <body>
    <div id="root"></div>
    <script>
      try {
        if (localStorage.getItem('kutubxona-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
